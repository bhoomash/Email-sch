services:
  # 1. Express Backend REST API Web Service
  - type: web
    name: reachinbox-backend-api
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: ELASTICSEARCH_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WORKER_CONCURRENCY
        value: 10
      - key: MIN_SEND_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50

  # 2. BullMQ Email Background Worker Service
  - type: worker
    name: reachinbox-email-worker
    env: node
    region: singapore
    plan: starter
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: ELASTICSEARCH_URL
        sync: false
      - key: WORKER_CONCURRENCY
        value: 10
      - key: MIN_SEND_DELAY_MS
        value: 2000
      - key: MAX_EMAILS_PER_HOUR_PER_SENDER
        value: 50
